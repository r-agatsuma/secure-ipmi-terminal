---
- name: installerで作成したsysadminユーザーが存在することを確認
  ansible.builtin.getent:
    database: passwd
    key: sysadmin

- name: sysadminのホームを本人以外から読めないようにする
  ansible.builtin.file:
    path: /home/sysadmin
    owner: sysadmin
    group: sysadmin
    mode: '0700'

- name: ipmiユーザーを作成
  ansible.builtin.user:
    name: ipmi
    comment: IPMI管理専用ユーザー
    shell: /bin/bash
    create_home: true
    home: /home/ipmi
    password_lock: true
    groups: ''
    append: false

- name: ipmiのホームを本人以外から読めないようにする
  ansible.builtin.file:
    path: /home/ipmi
    owner: ipmi
    group: ipmi
    mode: '0700'

- name: rootのパスワードログインをロック
  ansible.builtin.user:
    name: root
    password_lock: true
