---
- name: secure-ipmi-terminal credential finalization
  hosts: local
  gather_facts: true
  become: false

  vars:
    # このplaybookは旧password credentialを廃止する一回限りのcommit操作。
    finalize_credentials: false

  pre_tasks:
    - name: rootで実行されていることを確認
      ansible.builtin.assert:
        that:
          - ansible_user_uid == 0
        fail_msg: "sudo ansible-playbook finalize.yml -e finalize_credentials=true の形で実行してください。"

    - name: Debian 13系であることを確認
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Debian'
          - ansible_distribution_major_version == '13'
        fail_msg: "このCookbookはDebian 13 (trixie)専用です。"

    - name: credential finalizationの明示的なcommitを要求
      ansible.builtin.assert:
        that:
          - finalize_credentials | bool
        fail_msg: >-
          このplaybookはUNIX passwordをlockし、LUKSのtraditional password slotを削除します。
          GDM/TTY/sudo/cold bootのFIDO2認証を実機確認した後、
          -e finalize_credentials=true を付けて明示的に実行してください。

    - name: configure済みのPAM policyが存在することを確認
      ansible.builtin.shell: |
        set -eu
        test -s /etc/u2f_mappings
        test -f /etc/pam.d/secure-ipmi-terminal-gdm
        test -f /etc/pam.d/secure-ipmi-terminal-login
        test -f /etc/pam.d/secure-ipmi-terminal-sudo
      args:
        executable: /bin/sh
      changed_when: false

    - name: root LUKS用crypttab sourceを特定
      ansible.builtin.shell: |
        awk '
          /^[[:space:]]*(#|$)/ { next }
          {
            nopts = split($4, opts, ",")
            for (i = 1; i <= nopts; i++) {
              if (opts[i] == "x-initrd.attach") {
                print $2
                count++
              }
            }
          }
          END { if (count != 1) exit 1 }
        ' /etc/crypttab
      args:
        executable: /bin/sh
      register: finalize_luks_source
      changed_when: false

    - name: root LUKS deviceを解決
      ansible.builtin.shell: |
        set -eu
        source='{{ finalize_luks_source.stdout }}'
        case "$source" in
          UUID=*) path="/dev/disk/by-uuid/${source#UUID=}" ;;
          /dev/*) path="$source" ;;
          *)
            printf 'unsupported crypttab source: %s\n' "$source" >&2
            exit 1
            ;;
        esac
        readlink -f "$path"
      args:
        executable: /bin/sh
      register: finalize_luks_device
      changed_when: false

    - name: root LUKS2にFIDO2 tokenが1個以上あることを確認
      ansible.builtin.shell: |
        set -eu
        cryptsetup luksDump --dump-json-metadata '{{ finalize_luks_device.stdout }}' \
          | jq -e '[.tokens[]? | select(.type == "systemd-fido2")] | length > 0' \
          >/dev/null
      args:
        executable: /bin/sh
      changed_when: false

  tasks:
    - name: UNIX password credentialをlock
      ansible.builtin.user:
        name: "{{ item }}"
        password_lock: true
      loop:
        - root
        - ipmi
        - sysadmin

    - name: LUKS traditional password slotを削除
      ansible.builtin.command:
        argv:
          - systemd-cryptenroll
          - --wipe-slot=password
          - "{{ finalize_luks_device.stdout }}"
      changed_when: true

  post_tasks:
    - name: LUKS FIDO2 tokenが削除後も残っていることを確認
      ansible.builtin.shell: |
        set -eu
        cryptsetup luksDump --dump-json-metadata '{{ finalize_luks_device.stdout }}' \
          | jq -e '[.tokens[]? | select(.type == "systemd-fido2")] | length > 0' \
          >/dev/null
      args:
        executable: /bin/sh
      changed_when: false

    - name: FIDO2-only構成へのcommit完了を案内
      ansible.builtin.debug:
        msg:
          - "旧password credentialを廃止しました。"
          - "root/ipmi/sysadminのUNIX passwordはlock済みです。"
          - "LUKSのtraditional password slotは削除済みで、Installer時passphraseはrecovery手段ではありません。"
          - "通常GRUB entryからcold bootし、FIDO2 PIN+touchで起動できることを最終確認してください。"
          - "YubiKey紛失・故障やFIDO2 boot経路の破損で解錠不能になった場合、この端末は再インストールします。"
